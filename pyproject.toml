[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "next26-agent-platform-showcase"
version = "0.1.0"
description = "Google Cloud Next '26 Gemini Enterprise Agent Platform showcase"
requires-python = ">=3.11"
dependencies = [
  "google-auth>=2.29.0",
  "google-cloud-aiplatform[agent_engines,adk]>=1.112",
  "google-cloud-bigquery>=3.25.0",
  "google-cloud-storage>=2.18.0",
  "google-cloud-logging>=3.11.0",
  "google-cloud-monitoring>=2.24.0",
  "google-cloud-firestore>=2.16.0",
  "pandas>=2.2.2",
  "python-dotenv>=1.0.1",
  "requests>=2.32.3",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.6",
  "httpx>=0.27.2",
  "opentelemetry-api>=1.27.0",
  "opentelemetry-sdk>=1.27.0",
  "cloudpickle>=3.1.2",
  "pydantic>=2.13.3",
  "mcp>=1.27.0,<2",
]

[tool.setuptools]
packages = ["app", "app.agents", "app.tools", "app.deploy"]

[dependency-groups]
dev = ["bandit>=1.9.4", "pylint>=4.0.5", "pyright>=1.1.408", "ruff>=0.15.11"]
